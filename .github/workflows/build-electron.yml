name: Build Windows Portable Electron
run-name: "VibeEngine EXE ${{ inputs.job_id }}"
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Build job id"
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ vars.WEB2APK_BASE_URL }}
      RUNNER_SECRET: ${{ secrets.WEB2APK_RUNNER_SECRET }}
    steps:
      - name: Get job details
        shell: pwsh
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          if (-not $env:BASE_URL) { throw "WEB2APK_BASE_URL is missing" }
          if (-not $env:RUNNER_SECRET) { throw "WEB2APK_RUNNER_SECRET is missing" }
          curl.exe --fail --silent --show-error -H "X-Runner-Secret: $env:RUNNER_SECRET" "$env:BASE_URL/api.php?action=runner_meta&job_id=$env:JOB_ID" -o meta.json
          curl.exe --fail --silent --show-error -H "X-Runner-Secret: $env:RUNNER_SECRET" "$env:BASE_URL/api.php?action=runner_download&job_id=$env:JOB_ID" -o site.zip
          if ((Get-Content meta.json -Raw | ConvertFrom-Json).has_icon) {
            curl.exe --fail --silent --show-error -H "X-Runner-Secret: $env:RUNNER_SECRET" "$env:BASE_URL/api.php?action=runner_icon&job_id=$env:JOB_ID" -o icon.png
          }
      - name: Prepare Electron project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app | Out-Null
          Expand-Archive -Path site.zip -DestinationPath app -Force
          $meta = Get-Content meta.json -Raw | ConvertFrom-Json
          $safeName = ([string]$meta.app_name).ToLower() -replace '[^a-z0-9-]+','-'
          if (-not $safeName) { $safeName = "vibeengine-game" }
          $version = [string]$meta.version_name
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "1.0.0" }
          $iconPath = $null
          if (Test-Path icon.png) {
            Add-Type -AssemblyName System.Drawing
            $img = [System.Drawing.Image]::FromFile((Resolve-Path icon.png))
            try {
              $bmp = New-Object System.Drawing.Bitmap 256,256
              try {
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                try { $g.DrawImage($img,0,0,256,256); $h = $bmp.GetHicon(); try { $ico = [System.Drawing.Icon]::FromHandle($h); try { $fs = [System.IO.File]::Create((Join-Path (Get-Location) 'app/app.ico')); try { $ico.Save($fs) } finally { $fs.Dispose() } } finally { $ico.Dispose() } } finally { [void][System.Runtime.InteropServices.Marshal]::DestroyIcon($h) } } finally { $g.Dispose() }
              } finally { $bmp.Dispose() }
            } finally { $img.Dispose() }
            $iconPath = 'app.ico'
          }
          $winConfig = @{ target = @('portable'); artifactName = '${productName}-${version}-portable.${ext}' }
          if ($iconPath) { $winConfig.icon = $iconPath }
          $package = @{
            name = $safeName.Trim('-')
            version = $version
            private = $true
            main = "main.cjs"
            scripts = @{ build = "electron-builder --win portable" }
            devDependencies = @{ electron = "^33.0.0"; "electron-builder" = "^25.1.8" }
            build = @{
              appId = [string]$meta.package_name
              productName = [string]$meta.app_name
              directories = @{ output = "dist" }
              files = @("index.html","main.cjs")
              win = $winConfig
            }
          }
          $package | ConvertTo-Json -Depth 10 | Set-Content app/package.json -Encoding utf8
          @'
          const { app, BrowserWindow } = require("electron");
          const path = require("path");
          function createWindow() {
            const win = new BrowserWindow({
              width: 1280, height: 800, minWidth: 800, minHeight: 600,
              backgroundColor: "#101114",
              autoHideMenuBar: true,
              webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true }
            });
            win.loadFile(path.join(__dirname, "index.html"));
          }
          app.whenReady().then(() => {
            createWindow();
            app.on("activate", () => { if (BrowserWindow.getAllWindows().length === 0) createWindow(); });
          });
          app.on("window-all-closed", () => { if (process.platform !== "darwin") app.quit(); });
          '@ | Set-Content app/main.cjs -Encoding utf8
      - name: Build portable EXE
        shell: pwsh
        run: |
          cd app
          npm install
          npm run build
      - name: Return EXE to builder in chunks
        if: always()
        shell: pwsh
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          $exe = Get-ChildItem app/dist -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            curl.exe --silent --show-error --fail -X POST -H "X-Runner-Secret: $env:RUNNER_SECRET" -F "job_id=$env:JOB_ID" -F "message=Ошибка сборки Windows Portable" "$env:BASE_URL/api.php?action=runner_result"
            exit 1
          }
          $chunkSize = 4MB
          $total = [int][Math]::Ceiling($exe.Length / $chunkSize)
          $stream = [System.IO.File]::OpenRead($exe.FullName)
          $buffer = New-Object byte[] $chunkSize
          $tempChunk = Join-Path $env:RUNNER_TEMP "vibeengine-exe-chunk.bin"
          try {
            for ($i = 0; $i -lt $total; $i++) {
              $read = $stream.Read($buffer, 0, $buffer.Length)
              if ($read -le 0) { throw "Unexpected end of EXE while splitting" }
              [System.IO.File]::WriteAllBytes($tempChunk, $buffer[0..($read - 1)])
              curl.exe --fail --silent --show-error -X POST `
                -H "X-Runner-Secret: $env:RUNNER_SECRET" `
                -F "job_id=$env:JOB_ID" `
                -F "chunk_index=$i" `
                -F "total_chunks=$total" `
                -F "chunk=@$tempChunk;type=application/octet-stream" `
                "$env:BASE_URL/api.php?action=runner_result_chunk"
              if ($LASTEXITCODE -ne 0) { throw "Failed to upload EXE chunk $i/$total" }
              Write-Host "Uploaded EXE chunk $($i + 1)/$total"
            }
          }
          finally {
            $stream.Dispose()
            Remove-Item $tempChunk -Force -ErrorAction SilentlyContinue
          }
