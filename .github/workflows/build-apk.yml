name: Build Android APK
run-name: "Web2APK ${{ inputs.job_id }}"
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Web2APK job id"
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.WEB2APK_BASE_URL }}
      RUNNER_SECRET: ${{ secrets.WEB2APK_RUNNER_SECRET }}
    timeout-minutes: 30
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Get job details
        env:
          JOB_ID: ${{ inputs.job_id }}
          BASE_URL: ${{ vars.WEB2APK_BASE_URL }}
          RUNNER_SECRET: ${{ secrets.WEB2APK_RUNNER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || (echo "WEB2APK_BASE_URL repository variable is missing"; exit 1)
          test -n "$RUNNER_SECRET" || (echo "WEB2APK_RUNNER_SECRET repository secret is missing"; exit 1)
          curl --fail --silent --show-error -H "X-Runner-Secret: $RUNNER_SECRET" "$BASE_URL/api.php?action=runner_meta&job_id=$JOB_ID" -o meta.json
          curl --fail --silent --show-error -H "X-Runner-Secret: $RUNNER_SECRET" "$BASE_URL/api.php?action=runner_download&job_id=$JOB_ID" -o site.zip
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "RUNNER_SECRET=$RUNNER_SECRET" >> "$GITHUB_ENV"
      - name: Prepare Capacitor project
        run: |
          set -euo pipefail
          mkdir -p app/www
          unzip -q site.zip -d app/www
          cd app
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('../meta.json'));fs.writeFileSync('package.json',JSON.stringify({name:'web2apk-app',version:'1.0.0',private:true},null,2));fs.writeFileSync('capacitor.config.json',JSON.stringify({appId:m.package_name,appName:m.app_name,webDir:'www',server:{androidScheme:'https'}},null,2));"
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
      - name: Apply APK settings
        run: |
          set -euo pipefail
          cat > apply-settings.js <<'EOF'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('../meta.json', 'utf8'));
          const fail = msg => { console.error('APK settings: ' + msg); process.exit(1); };
          const min = Number(m.min_sdk || 22), target = Number(m.target_sdk || 34);
          const vgPath = 'android/variables.gradle';
          const vgOld = fs.readFileSync(vgPath, 'utf8');
          const vg = vgOld
            .replace(/minSdkVersion\s*=\s*\d+/, 'minSdkVersion = ' + min)
            .replace(/compileSdkVersion\s*=\s*\d+/, 'compileSdkVersion = ' + target)
            .replace(/targetSdkVersion\s*=\s*\d+/, 'targetSdkVersion = ' + target);
          if (vg === vgOld) fail('SDK-версии не найдены в variables.gradle');
          fs.writeFileSync(vgPath, vg);
          const mfPath = 'android/app/src/main/AndroidManifest.xml';
          if (m.orientation) {
            const mfOld = fs.readFileSync(mfPath, 'utf8');
            const o = m.orientation === 'landscape' ? 'landscape' : 'portrait';
            const mf = mfOld.replace(/(<activity\b[^>]*android:name="\.MainActivity")/, '$1 android:screenOrientation="' + o + '"');
            if (mf === mfOld) fail('MainActivity не найдена в манифесте');
            fs.writeFileSync(mfPath, mf);
          }
          if (m.hide_status_bar) {
            const stPath = 'android/app/src/main/res/values/styles.xml';
            const stOld = fs.readFileSync(stPath, 'utf8');
            const st = stOld.replace(/(<style name="AppTheme\.NoActionBar"[^>]*>)/, '$1<item name="android:windowFullscreen">true</item>');
            if (st === stOld) fail('тема AppTheme.NoActionBar не найдена в styles.xml');
            fs.writeFileSync(stPath, st);
          }
          console.log('APK settings applied:', { min, target, orientation: m.orientation || 'не менять', hide_status_bar: !!m.hide_status_bar });
          EOF
          cd app
          node ../apply-settings.js
      - name: Build debug APK
        run: |
          set -euo pipefail
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK to PHP host
        if: always()
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          APK="app/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            curl --fail --silent --show-error -X POST \
              -H "X-Runner-Secret: $RUNNER_SECRET" \
              -F "job_id=$JOB_ID" -F "apk=@$APK" \
              "$BASE_URL/api.php?action=runner_result"
          else
            curl --silent --show-error -X POST \
              -H "X-Runner-Secret: $RUNNER_SECRET" \
              -F "job_id=$JOB_ID" -F "message=Build failed. Open the GitHub Actions run log for details." \
              "$BASE_URL/api.php?action=runner_result" || true
            exit 1
          fi
