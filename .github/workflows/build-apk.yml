name: Build Android APK
run-name: "Web2APK ${{ inputs.job_id }}"
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Web2APK job id"
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.WEB2APK_BASE_URL }}
      RUNNER_SECRET: ${{ secrets.WEB2APK_RUNNER_SECRET }}
    timeout-minutes: 30
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Get job details
        env:
          JOB_ID: ${{ inputs.job_id }}
          BASE_URL: ${{ vars.WEB2APK_BASE_URL }}
          RUNNER_SECRET: ${{ secrets.WEB2APK_RUNNER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || (echo "WEB2APK_BASE_URL repository variable is missing"; exit 1)
          test -n "$RUNNER_SECRET" || (echo "WEB2APK_RUNNER_SECRET repository secret is missing"; exit 1)
          curl --fail --silent --show-error -H "X-Runner-Secret: $RUNNER_SECRET" "$BASE_URL/api.php?action=runner_meta&job_id=$JOB_ID" -o meta.json
          curl --fail --silent --show-error -H "X-Runner-Secret: $RUNNER_SECRET" "$BASE_URL/api.php?action=runner_download&job_id=$JOB_ID" -o site.zip
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "RUNNER_SECRET=$RUNNER_SECRET" >> "$GITHUB_ENV"
      - name: Fetch signing key (custom only)
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./meta.json').signing?.mode === 'custom' ? 0 : 1)"; then
            curl --fail --silent --show-error -H "X-Runner-Secret: $RUNNER_SECRET" "$BASE_URL/api.php?action=runner_keystore&job_id=$JOB_ID" -o signing.jks
          fi
      - name: Fetch app icon (if set)
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./meta.json').has_icon ? 0 : 1)"; then
            curl --fail --silent --show-error -H "X-Runner-Secret: $RUNNER_SECRET" "$BASE_URL/api.php?action=runner_icon&job_id=$JOB_ID" -o icon.png
          fi
      - name: Prepare Capacitor project
        run: |
          set -euo pipefail
          mkdir -p app/www
          unzip -q site.zip -d app/www
          cd app
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('../meta.json'));fs.writeFileSync('package.json',JSON.stringify({name:'web2apk-app',version:'1.0.0',private:true},null,2));fs.writeFileSync('capacitor.config.json',JSON.stringify({appId:m.package_name,appName:m.app_name,webDir:'www',server:{androidScheme:'https'},android:{backgroundColor:'#000000'}},null,2));"
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
      - name: Apply APK settings
        run: |
          set -euo pipefail
          cat > apply-settings.js <<'EOF'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('../meta.json', 'utf8'));
          const fail = msg => { console.error('APK settings: ' + msg); process.exit(1); };
          const min = Number(m.min_sdk || 22), target = Number(m.target_sdk || 34);
          const vgPath = 'android/variables.gradle';
          const vgOld = fs.readFileSync(vgPath, 'utf8');
          const vg = vgOld
            .replace(/minSdkVersion\s*=\s*\d+/, 'minSdkVersion = ' + min)
            .replace(/compileSdkVersion\s*=\s*\d+/, 'compileSdkVersion = ' + target)
            .replace(/targetSdkVersion\s*=\s*\d+/, 'targetSdkVersion = ' + target);
          const sdkPatterns = [/minSdkVersion\s*=\s*\d+/, /compileSdkVersion\s*=\s*\d+/, /targetSdkVersion\s*=\s*\d+/];
          if (!sdkPatterns.every(re => re.test(vgOld))) { console.error(vgOld); fail('SDK-версии не найдены в variables.gradle (содержимое выше)'); }
          fs.writeFileSync(vgPath, vg);
          const mfPath = 'android/app/src/main/AndroidManifest.xml';
          if (m.orientation) {
            const mfOld = fs.readFileSync(mfPath, 'utf8');
            const o = m.orientation === 'landscape' ? 'landscape' : (m.orientation === 'any' ? 'fullSensor' : 'portrait');
            const mf = mfOld.replace(/(<activity\b[^>]*android:name="\.MainActivity")/, '$1 android:screenOrientation="' + o + '"');
            if (mf === mfOld) fail('MainActivity не найдена в манифесте');
            fs.writeFileSync(mfPath, mf);
          }
          if (m.hide_nav_bar) {
            const found = require('child_process').execSync('find android/app/src/main/java -name MainActivity.java').toString().trim().split('\n')[0];
            if (!found) fail('MainActivity.java не найден');
            const javaOld = fs.readFileSync(found, 'utf8');
            const re = /extends\s+BridgeActivity\s*\{/;
            if (!re.test(javaOld)) fail('MainActivity.java не похожа на шаблон Capacitor');
            const method = `
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                          | android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  }
              }
          `;
            fs.writeFileSync(found, javaOld.replace(re, mt => mt + method));
          }
          {
            const stPath = 'android/app/src/main/res/values/styles.xml';
            const stOld = fs.readFileSync(stPath, 'utf8');
            if (!/<style name="AppTheme\.NoActionBar"/.test(stOld)) fail('тема AppTheme.NoActionBar не найдена в styles.xml');
            const items = '<item name="android:windowBackground">#000000</item>' +
              '<item name="android:navigationBarColor">#000000</item>' +
              '<item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>' +
              (m.hide_status_bar ? '<item name="android:windowFullscreen">true</item>' : '');
            fs.writeFileSync(stPath, stOld.replace(/(<style name="AppTheme\.NoActionBar"[^>]*>)/, '$1' + items));
          }
          console.log('APK settings applied:', { min, target, orientation: m.orientation || 'не менять', hide_status_bar: !!m.hide_status_bar });
          EOF
          cd app
          node ../apply-settings.js
      - name: Apply app icon
        run: |
          set -euo pipefail
          if [ ! -f icon.png ]; then echo "Иконка не задана, используется стандартная"; exit 0; fi
          ICON="$PWD/icon.png"
          RES=app/android/app/src/main/res
          # адаптивная иконка (anydpi) берёт векторный слой из шаблона — убираем, чтобы работали PNG-версии
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            mkdir -p "$RES/mipmap-$name"
            convert "$ICON" -resize "${size}x${size}" "$RES/mipmap-$name/ic_launcher.png"
            cp "$RES/mipmap-$name/ic_launcher.png" "$RES/mipmap-$name/ic_launcher_round.png"
          done
          echo "Иконка приложения применена"
      - name: Apply signing
        run: |
          set -euo pipefail
          cat > apply-signing.js <<'EOF'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('../meta.json', 'utf8'));
          const s = m.signing || { mode: 'test' };
          const setEnv = (k, v) => fs.appendFileSync(process.env.GITHUB_ENV, k + '=' + v + '\n');
          const fail = msg => { console.error('Signing: ' + msg); process.exit(1); };
          if (s.mode !== 'custom') { setEnv('WEB2APK_SIGN_MODE', 'test'); process.exit(0); }
          for (const v of [s.alias, s.store_password, s.key_password]) {
            if (!v) fail('не переданы алиас или пароли');
          }
          [s.store_password, s.key_password].forEach(v => console.log('::add-mask::' + v));
          const gPath = 'android/app/build.gradle';
          const gOld = fs.readFileSync(gPath, 'utf8');
          if (!/buildTypes\s*\{/.test(gOld) || !/buildTypes\s*\{[\s\S]*?release\s*\{/.test(gOld)) fail('блок buildTypes/release не найден в build.gradle');
          const signingBlock = 'signingConfigs {\n        release {\n            storeFile file("release.jks")\n            storePassword System.getenv("WEB2APK_STORE_PASSWORD")\n            keyAlias System.getenv("WEB2APK_KEY_ALIAS")\n            keyPassword System.getenv("WEB2APK_KEY_PASSWORD")\n        }\n    }\n    ';
          const gNew = gOld
            .replace(/(buildTypes\s*\{)/, signingBlock + '$1')
            .replace(/(buildTypes\s*\{[\s\S]*?release\s*\{)/, '$1\n            signingConfig signingConfigs.release');
          fs.writeFileSync(gPath, gNew);
          fs.copyFileSync('../signing.jks', 'android/app/release.jks');
          setEnv('WEB2APK_SIGN_MODE', 'custom');
          setEnv('WEB2APK_KEY_ALIAS', s.alias);
          setEnv('WEB2APK_STORE_PASSWORD', s.store_password);
          setEnv('WEB2APK_KEY_PASSWORD', s.key_password);
          console.log('Signing: свой ключ, алиас ' + s.alias);
          EOF
          cd app
          node ../apply-signing.js
      - name: Build APK
        run: |
          set -euo pipefail
          cd app/android
          chmod +x gradlew
          if [ "${WEB2APK_SIGN_MODE:-test}" = "custom" ]; then
            ./gradlew assembleRelease
            echo "APK_PATH=app/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug
            echo "APK_PATH=app/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
      - name: Upload APK to PHP host
        if: always()
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          APK="${APK_PATH:-}"
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            curl --fail --silent --show-error -X POST \
              -H "X-Runner-Secret: $RUNNER_SECRET" \
              -F "job_id=$JOB_ID" -F "apk=@$APK" \
              "$BASE_URL/api.php?action=runner_result"
          else
            curl --silent --show-error -X POST \
              -H "X-Runner-Secret: $RUNNER_SECRET" \
              -F "job_id=$JOB_ID" -F "message=Ошибка сборки APK. Попробуйте ещё раз." \
              "$BASE_URL/api.php?action=runner_result" || true
            exit 1
          fi
